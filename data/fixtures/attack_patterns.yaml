_WARNING: DEFENSIVE FIXTURE -- published prompt-injection patterns held for evaluating a defence. Do not
  redistribute as an attack toolkit. Every string here is copied verbatim from an already-public research
  dataset or from this project's own documentation. Nothing in this repository generates, mutates or optimises
  injection payloads (SPEC.md section 9).
_sources:
  xTRam1/safe-guard-prompt-injection: 1559
  deepset/prompt-injections: 137
  SPEC.md section 2: 1
_note: 'These payloads are CHAT-shaped, because that is what the published corpora contain -- no public
  dataset of catalogue-shaped injections exists. We deliberately did not invent commerce-flavoured variants.
  The experiment therefore holds the payload constant and varies only the CONTEXT it sits in: standalone,
  versus embedded in a real product description. That isolates whether catalogue text masks an injection
  from a chat-trained detector.'
